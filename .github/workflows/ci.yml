name: CI

# Regressions get introduced when code changes, so this is the run that matters.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries ship inside this image. Installing
    # WebKit's dependencies with apt on a bare runner took over 16 minutes and
    # blew the job timeout; here it costs nothing. Keep the tag in step with the
    # @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # A separate Neon project — never the production database.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The container tag is pinned by hand, so catch drift here rather than
      # letting it surface as a confusing browser-launch error later.
      - name: Container image matches @playwright/test
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          pinned=$(grep -oE 'playwright:v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml | head -1 | cut -c13-)
          if [ "$installed" != "$pinned" ]; then
            echo "::error file=.github/workflows/ci.yml::@playwright/test is $installed but the CI container is pinned to v$pinned. Update the image tag to mcr.microsoft.com/playwright:v$installed-noble."
            exit 1
          fi
          echo "Playwright v$installed matches the container image."

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: API tests
        run: npm run test:api

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
